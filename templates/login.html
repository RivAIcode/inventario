<!DOCTYPE html>
<html>
<head>
    <title>Login - Inventario de Equipos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2196F3, #1565C0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        h1 {
            color: #2196F3;
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1976D2;
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .flash {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .flash.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        .flash.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
        .flash.warning {
            background: #fff8e1;
            color: #f57c00;
            border-left: 4px solid #f57c00;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>📊 SISTEMA DE INVENTARIO</h1>
        <div class="subtitle">Ingrese sus credenciales</div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" required autofocus autocomplete="off">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required autocomplete="off">
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
        // Limpiar mensajes flash al recargar la página (evita mensajes antiguos)
        (function() {
            // Detectar si la página se recargó (no un envío de formulario)
            if (performance.navigation.type === 1 || 
                (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]?.type === 'reload')) {
                fetch('/limpiar_flash', { method: 'POST' }).catch(() => {});
            }
        })();
    </script>
</body>
</html>

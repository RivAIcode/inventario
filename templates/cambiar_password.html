<!DOCTYPE html>
<html>
<head>
    <title>Cambiar Contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h1>🔐 CAMBIAR CONTRASEÑA</h1>
        <div>
            <span>👤 {{ current_user.nombre }}</span>
            <a href="{{ url_for('logout') }}">Salir</a>
        </div>
    </div>

    <div class="container">
        <div style="background: #fff8e1; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <p style="color: #f57c00; margin: 0;">
                ⚠️ Es la primera vez que inicias sesión o un administrador te ha solicitado cambiar tu contraseña.
                <br>Por favor, establece una nueva contraseña para continuar.
            </p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Nueva Contraseña *</label>
                <input type="password" name="nueva_password" required minlength="4">
                <small>Mínimo 4 caracteres</small>
            </div>
            
            <div class="form-group">
                <label>Confirmar Contraseña *</label>
                <input type="password" name="confirmar_password" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">✅ Cambiar Contraseña</button>
                <a href="{{ url_for('logout') }}" class="btn btn-secondary">Cerrar Sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
